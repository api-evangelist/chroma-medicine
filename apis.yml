aid: chroma-medicine
name: Chroma Medicine
description: 'Chroma Medicine was a Boston-based, clinical-stage biotechnology company
  developing epigenetic editors — CRISPR-derived medicines that silence or activate
  genes by writing epigenetic marks rather than cutting DNA — with CRMA-1001, a liver-targeted
  epigenetic editing therapy for chronic hepatitis B and hepatitis D, as its lead program.
  In December 2024 it merged with Nvelop Therapeutics, pairing Chroma''s epigenetic
  editors with Nvelop''s non-viral in vivo delivery vehicles, to form nChroma Bio with
  $75 million in new financing. chromamedicine.com now redirects to nchromabio.com.
  As a therapeutics developer it publishes no developer program, public API, SDK, or
  machine-readable specification of any kind.'
